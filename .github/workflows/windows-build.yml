# On every push: run all checks on Windows, build VSDPad.exe + the installer, make sure the built app starts,
# and attach VSDPad-Setup-<version>.exe to the run (Actions tab -> the run -> Artifacts).
name: Windows build

on:
  push:
    branches: [main, revamp-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish each build as a release (the installed app updates itself from these)

env:
  RELEASE_BRANCH: revamp-v2   # pushes to this branch become updates; change when the work moves to main

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # optional code signing: a .pfx certificate (base64) and its password, in Settings -> Secrets -> Actions
      SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: next/installer/requirements.txt

      # PyInstaller's ready-made launcher is shared by thousands of programs, including real malware, so antivirus
      # programs often flag anything built with it. Compiling our own copy of the launcher avoids most of that.
      - name: Install (PyInstaller with its launcher compiled here)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller -r installer/requirements.txt

      - name: Run all checks
        run: python tests/run_all.py

      - name: Stamp the build number (the app compares it to find updates)
        run: Set-Content -Path vsdpad/_build.py -Value "BUILD = ${{ github.run_number }}"

      - name: Build VSDPad.exe
        run: python -m PyInstaller --noconfirm --clean --distpath build/dist --workpath build/work installer/vsdpad.spec

      - name: Check the app has its version details
        shell: pwsh
        run: |
          $v = (Get-Item build\dist\VSDPad\VSDPad.exe).VersionInfo
          "$($v.ProductName) $($v.FileVersion) by $($v.CompanyName)"
          if ($v.ProductName -ne "VSD Pad" -or $v.FilePrivatePart -ne ${{ github.run_number }}) { throw "VSDPad.exe has no version details" }

      - name: Sign the app (only when a code signing certificate is set up)
        if: env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: installer\sign.ps1 build\dist\VSDPad\VSDPad.exe

      - name: Check the build has the Now playing add-on
        shell: pwsh
        run: |
          if (-not (Get-ChildItem build\dist\VSDPad -Recurse -Filter "*media*control*")) { throw "winrt media control is missing from the build" }
          Get-ChildItem build\dist\VSDPad -Recurse -Filter "*media*control*" | Select-Object -First 3 FullName

      - name: Check the built app starts (pretend pad, settings page, plugins)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "vsdpad-smoke"
          $p = Start-Process build\dist\VSDPad\VSDPad.exe -ArgumentList "--simulate","m18,xl","--no-tray","--port","18900","--data",$data -PassThru
          try {
            $page = $null
            foreach ($i in 1..40) { try { $page = Invoke-WebRequest http://127.0.0.1:18900/ -UseBasicParsing; break } catch { Start-Sleep 1 } }
            if (-not $page) { Get-Content "$data\vsdpad.log" -ErrorAction SilentlyContinue; throw "the app didn't start" }
            $token = [regex]::Match($page.Content, 'TOKEN\s*=\s*"([^"]+)"').Groups[1].Value
            $state = Invoke-RestMethod http://127.0.0.1:18900/api/state -Headers @{ "X-VSDPad-Token" = $token }
            $plugins = $state.plugins.id
            "plugins: $($plugins -join ', ')"
            "themes: $($state.themes.Count)  icon packs: $($state.iconpacks.Count)"
            foreach ($need in "system", "pages", "homeassistant", "hue", "wavelength", "subwave", "clock", "weather", "macro", "obs", "nowplaying", "updates", "notify", "stats", "raccoon") {
              if ($plugins -notcontains $need) { throw "plugin $need is missing from the build" }
            }
            if ($state.themes.Count -lt 5) { throw "themes are missing from the build" }
            $auto = Invoke-RestMethod http://127.0.0.1:18900/api/autostart -Headers @{ "X-VSDPad-Token" = $token }
            if (-not $auto.supported) { throw "Start with Windows says it's not supported" }
            $ico = Invoke-WebRequest "http://127.0.0.1:18900/api/theme_preview.png?t=$token" -UseBasicParsing
            if ($ico.StatusCode -ne 200) { throw "key rendering failed" }
            if (Select-String -Path "$data\vsdpad.log" -Pattern "CRITICAL|failed to load" -Quiet) {
              Get-Content "$data\vsdpad.log"; throw "errors in the log"
            }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Build the installer
        shell: pwsh
        run: |
          $base = (python -c "import vsdpad; print(vsdpad.__version__)").Trim()
          $version = "$base-build${{ github.run_number }}"
          $num = ([regex]::Matches($base, "\d+") | Select-Object -First 3 | ForEach-Object Value) -join "."
          $num = "$num.${{ github.run_number }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$version" "/DNumVersion=$num" "/DSourceDir=$PWD\build\dist\VSDPad" "/DOutputDir=$PWD\build" installer\vsdpad.iss
          if ($LASTEXITCODE) { throw "Inno Setup failed" }
          Get-ChildItem build\VSDPad-Setup-*.exe

      - name: Sign the installer (only when a code signing certificate is set up)
        if: env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: installer\sign.ps1 (Get-ChildItem build\VSDPad-Setup-*.exe | Select-Object -First 1).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: VSDPad-Setup
          path: next/build/VSDPad-Setup-*.exe
          retention-days: 30

      - name: Publish as an update
        if: github.event_name == 'push' && github.ref_name == env.RELEASE_BRANCH
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          git log -1 --format=%B | Set-Content -Path "$env:RUNNER_TEMP\notes.txt"
          $exe = (Get-ChildItem build\VSDPad-Setup-*.exe | Select-Object -First 1).FullName
          gh release create $tag $exe --title "VSD Pad build ${{ github.run_number }}" --notes-file "$env:RUNNER_TEMP\notes.txt" --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE) { throw "couldn't publish the release" }
          # keep the newest 10 builds
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            ForEach-Object { gh release delete $_ --yes --cleanup-tag }
