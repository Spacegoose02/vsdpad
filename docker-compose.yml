# VSD Pad server.  docker compose up -d   then open http://<server>:8765 (sign in as admin with the password below)
services:
  vsdpad:
    image: ghcr.io/spacegoose02/vsdpad:latest
    # build: .            # or build it here instead of pulling
    container_name: vsdpad
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      VSDPAD_USER: "admin"
      VSDPAD_PASSWORD: "change-me"
      # optional: read-only GitHub token so the server passes app updates on to your PC
      VSDPAD_GITHUB_TOKEN: ""
      TZ: "America/New_York"
    volumes:
      - ./vsdpad-data:/data
