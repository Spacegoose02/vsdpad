<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSD Pad</title>
<style>
  :root {
    --bg: #101116; --panel: #1a1c23; --panel2: #23262f; --line: #2f3340; --text: #eceef4; --muted: #8f95a8;
    --accent: #ffaa28; --accent-ink: #1a1203; --good: #5bd68a; --bad: #ff7a7a; --warn: #e6b450;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line);
           background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  #devpills { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  .pill { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
  .pill.on { color: var(--good); } .pill.off { color: var(--bad); } .pill.mid { color: var(--warn); }
  nav { display: flex; gap: 2px; padding: 10px 24px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { background: none; border: 0; color: var(--muted); padding: 8px 14px; font: inherit; cursor: pointer;
               border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.active { color: var(--text); border-color: var(--accent); }
  main { padding: 20px 24px 80px; max-width: 1240px; margin: 0 auto; }
  button.btn { font: inherit; font-size: 14px; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
               padding: 7px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  button.btn:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
  button.small { padding: 3px 9px; font-size: 13px; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                  border-radius: 8px; padding: 7px 10px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=color] { padding: 2px; height: 36px; width: 60px; }
  input[type=range] { padding: 0; } input[type=checkbox] { width: auto; accent-color: var(--accent); }
  label.f { display: block; margin: 0 0 12px; }
  label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .warn { color: var(--warn); }
  .err-text { color: var(--bad); font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; } .row > .fit { flex: 0 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .panel h2 { margin: 0 0 12px; font-size: 16px; }
  .panel h3 { margin: 16px 0 8px; font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); cursor: pointer; }
  .keys-layout { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 420px); gap: 24px; align-items: start; }
  @media (max-width: 900px) { .keys-layout { grid-template-columns: 1fr; } }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
  .tabchip { font: inherit; font-size: 13.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
             border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  .tabchip.sel { color: var(--text); border-color: var(--accent); background: var(--panel2); }
  .tabchip.folder { border-style: dashed; }
  .tabchip.add { border-style: dashed; }
  .tabchip .dot { color: var(--good); font-size: 10px; margin-left: 4px; }
  .layoutbar .tabchip { font-size: 13px; }
  .grid { display: grid; gap: 9px; background: var(--panel); padding: 14px; border-radius: 14px; border: 1px solid var(--line); }
  .key { padding: 0; border: 2px solid transparent; border-radius: 12px; background: #000; cursor: pointer;
         aspect-ratio: 1; overflow: hidden; position: relative; transition: transform .08s; }
  .key:active { transform: scale(.96); }
  .key.sel { border-color: var(--accent); }
  .key.ran { box-shadow: 0 0 0 3px var(--good); }
  .key.dragging { opacity: .35; }
  .key.over { outline: 3px dashed var(--accent); outline-offset: -3px; }
  .key img { width: 100%; height: 100%; display: block; }
  .key.blank { background: repeating-linear-gradient(45deg, #17181f, #17181f 8px, #1d1f27 8px, #1d1f27 16px); }
  .key .badge { position: absolute; bottom: 3px; right: 4px; font-size: 10px; background: rgba(0,0,0,.65); border-radius: 4px; padding: 0 4px; color: var(--accent); }
  .btnrow { display: flex; gap: 16px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .rbtn { width: 76px; height: 76px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--line); color: var(--text);
          cursor: pointer; font: inherit; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .rbtn.sel { border-color: var(--accent); } .rbtn.ran { box-shadow: 0 0 0 3px var(--good); }
  .rbtn span { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .chips button { width: 34px; height: 34px; font: 19px "Segoe UI Symbol", "Segoe UI Emoji", sans-serif; border-radius: 8px;
                  background: var(--panel2); color: var(--text); border: 1px solid var(--line); cursor: pointer; padding: 0; }
  .chips button:hover { border-color: var(--accent); }
  .step { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; background: var(--panel2); }
  .step .head { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
  .step .head b { flex: 1; color: var(--text); font-weight: 600; }
  .step label.f { margin-bottom: 8px; }
  details.gesture { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  details.gesture summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
  details.gesture summary small { color: var(--muted); font-weight: 400; }
  .pic { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .pic img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #000; }
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .card p { color: var(--muted); margin: 0 0 12px; }
  .card h2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card.active { border-color: var(--accent); }
  .theme-preview { width: 100%; border-radius: 10px; display: block; margin-bottom: 12px; background: #000; }
  .theme-cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; }
  .theme-cat { background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .theme-cat.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .theme-group { margin: 22px 0 10px; font-size: 17px; }
  table.list { width: 100%; border-collapse: collapse; }
  table.list td, table.list th { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; font-size: 14px; }
  table.list th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel2);
           border: 1px solid var(--line); padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none;
           transition: opacity .2s; max-width: 86vw; z-index: 10; }
  #toast.show { opacity: 1; } #toast.err { border-color: var(--bad); color: var(--bad); }
  .stack > * + * { margin-top: 16px; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
  /* icon picker (icon packs) */
  .ipick-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .ipick { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(860px, 100%); max-height: min(720px, 100%);
           display: flex; flex-direction: column; overflow: hidden; }
  .ipick-head { padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .ipick-head .top { display: flex; gap: 10px; align-items: center; }
  .ipick-head h2 { margin: 0; font-size: 17px; flex: 1; }
  .ipick-grid { overflow-y: auto; padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; align-content: start; flex: 1; }
  .ipick-grid button { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; height: 62px; padding: 0; cursor: pointer;
                       display: flex; align-items: center; justify-content: center; }
  .ipick-grid button:hover, .ipick-grid button:focus-visible { border-color: var(--accent); outline: none; }
  .ipick-grid button.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .ico { display: inline-block; width: 40px; height: 40px; flex: none; }
  .ico.small { width: 22px; height: 22px; vertical-align: middle; }
  .ipick-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ipick-foot .hint { margin: 0; flex: 1; min-width: 160px; }
  .iconfield { display: flex; gap: 8px; align-items: center; }
  .iconfield .ico-box { width: 44px; height: 38px; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--bg); flex: none; }
</style>
</head>
<body>
<header>
  <h1>VSD <span>Pad</span></h1>
  <div id="devpills"></div>
  <button id="undo" class="btn" title="Undo the last save">Undo save</button>
  <button id="save" class="btn primary" disabled>Save &amp; apply</button>
</header>
<nav id="tabs">
  <button data-tab="keys" class="active">Keys</button>
  <button data-tab="devices">Devices</button>
  <button data-tab="profiles">Profiles</button>
  <button data-tab="apps">App switching</button>
  <button data-tab="plugins">Plugins</button>
  <button data-tab="themes">Themes</button>
  <button data-tab="settings">Settings &amp; backup</button>
</nav>
<main id="main"></main>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ---------------- icon packs: picker, import ---------------- */
const IP = { index: new Map() };
const ipRef = ref => { const m = /^([a-z0-9_-]{1,32}):([a-z0-9][a-z0-9_.-]{0,63})$/.exec(ref || ""); return m ? { pack: m[1], name: m[2] } : null; };
const ipPacks = () => S.iconpacks || [];
const ipThemePack = () => (S.icon_theme_packs || {})[C().theme || "modern"] || "outline";
async function ipIndex(id) {
  const p = ipPacks().find(x => x.id === id), v = p ? p.version : 0, have = IP.index.get(id);
  if (have && have.version === v) return have;
  const j = await api("/api/iconpack?" + q({ id }));
  IP.index.set(id, j); return j;
}
/* One icon as a coloured shape (CSS mask over the pack's sprite sheet), or in its own colours. */
function ipIcon(ix, name, color, cls = "ico") {
  const i = ix.icons.indexOf(name), e = h("span", { class: cls, title: name });
  if (i < 0) return e;
  const url = `url("/api/iconpack_sprite.png?${q({ id: ix.id, v: ix.version })}")`;
  const size = cls.includes("small") ? 22 : 40, col = i % ix.cols, row = Math.floor(i / ix.cols);
  const pos = `${-col * size}px ${-row * size}px`, sz = `${ix.cols * size}px auto`;
  if (ix.tint === false) Object.assign(e.style, { backgroundImage: url, backgroundPosition: pos, backgroundSize: sz });
  else {
    e.style.backgroundColor = color;
    for (const pre of ["mask", "webkitMask"]) Object.assign(e.style, { [pre + "Image"]: url, [pre + "Position"]: pos, [pre + "Size"]: sz, [pre + "Repeat"]: "no-repeat" });
  }
  if (ix.style === "pixel") e.style.imageRendering = "pixelated";
  return e;
}
/* Small preview next to the icon field: pack icons show as the icon, text as itself. */
function ipPreview(ref, color) {
  const box = h("span", { class: "ico-box" });
  const r = ipRef(ref);
  if (!r) { box.textContent = ref || ""; return box; }
  const tries = r.pack === "theme" ? [ipThemePack(), "outline", "pixel"] : [r.pack];
  (async () => {
    for (const id of tries) {
      try { const ix = await ipIndex(id); if (ix.icons.includes(r.name)) return box.append(ipIcon(ix, r.name, color, "ico small")); } catch (e) { /* try the next */ }
    }
    box.textContent = "?";
  })();
  return box;
}
function ipField(key, set) {
  const color = hex(key.color || [255, 170, 40]);
  const wrap = h("div", { class: "iconfield" });
  const draw = () => {
    const input = h("input", { value: key.icon || "", maxlength: 100, placeholder: "symbol, emoji or short text",
      oninput: e => { set("icon", e.target.value); prev.replaceWith(prev = ipPreview(e.target.value, color)); } });
    let prev = ipPreview(key.icon, color);
    wrap.replaceChildren(prev, input, h("button", { class: "btn", type: "button", onclick: () => openIconPicker(key.icon, color, ref => { set("icon", ref); draw(); }) }, "Choose icon…"));
  };
  draw();
  return wrap;
}
async function openIconPicker(current, color, onPick) {
  const cur = ipRef(current), packs = ipPacks();
  if (!packs.length) return toast("No icon packs found.", true);
  let packId = cur && cur.pack !== "theme" && packs.some(p => p.id === cur.pack) ? cur.pack : ipThemePack();
  if (!packs.some(p => p.id === packId)) packId = packs[0].id;
  let follow = cur ? cur.pack === "theme" : true;
  const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  const search = h("input", { type: "search", placeholder: "Search icons: music, light, game, mic…", autofocus: true, oninput: () => fill() });
  const sel = h("select", { onchange: e => { packId = e.target.value; fill(); } });
  const followBox = h("label", { class: "chk", title: "The icon changes style with the theme (e.g. neon on Cyberpunk, pixel on Retro)" },
    h("input", { type: "checkbox", checked: follow, onchange: e => { follow = e.target.checked; } }), "Match the theme's icon style");
  const grid = h("div", { class: "ipick-grid" });
  const info = h("div", { class: "hint" });
  const del = h("button", { class: "btn small danger" }, "Delete pack");
  const exp = h("a", { class: "btn small", style: "text-decoration:none;color:inherit;border:1px solid var(--line);padding:3px 9px;border-radius:8px;font-size:13px" }, "Export");
  const fillSel = () => sel.replaceChildren(...ipPacks().map(p => h("option", { value: p.id, selected: p.id === packId },
    `${p.name} (${p.count})${p.builtin ? "" : " · yours"}`)));
  let ix = null;
  async function fill() {
    const p = ipPacks().find(x => x.id === packId);
    grid.replaceChildren(h("div", { class: "hint" }, "Loading…"));
    try { ix = await ipIndex(packId); } catch (e) { grid.replaceChildren(h("div", { class: "err-text" }, e.message)); return; }
    const words = search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    let hits = ix.icons.map((n, i) => ({ n, t: (n.replace(/-/g, " ") + " " + (ix.tags[n] || "")).toLowerCase() }));
    if (words.length) hits = hits.filter(x => words.every(w => x.t.includes(w)))
      .sort((a, b) => (b.n.startsWith(words[0]) - a.n.startsWith(words[0])) || a.n.length - b.n.length);
    const MAX = 480, shown = hits.slice(0, MAX);
    grid.replaceChildren(...shown.map(x => h("button", { type: "button", title: x.n, class: cur && cur.name === x.n ? "cur" : "",
      onclick: () => { onPick((follow && p.builtin && p.tint !== false ? "theme" : packId) + ":" + x.n); close(); } }, ipIcon(ix, x.n, color))));
    if (!shown.length) grid.append(h("div", { class: "hint" }, "No icons match. Try another word, or another pack."));
    info.textContent = (hits.length > MAX ? `Showing ${MAX} of ${hits.length}; type to narrow. ` : `${hits.length} icons. `) +
      (p && p.license ? `${p.name}: ${p.author || ""} (${p.license}).` : "") + (ix.pending && ix.pending.length ? ` ${ix.pending.length} SVGs not drawn yet.` : "");
    followBox.style.display = p && p.builtin && p.tint !== false ? "" : "none";
    del.style.display = exp.style.display = p && !p.builtin ? "" : "none";
    exp.href = "/api/iconpack_export?" + q({ id: packId });
  }
  del.onclick = async () => {
    const p = ipPacks().find(x => x.id === packId);
    if (!p || p.builtin || !confirm(`Delete the icon pack “${p.name}”? Keys using it will show no icon.`)) return;
    try { await api("/api/iconpack_delete", { id: p.id }); S.iconpacks = (await api("/api/iconpacks")).packs; packId = ipThemePack(); fillSel(); fill(); toast("Icon pack deleted"); }
    catch (e) { toast(e.message, true); }
  };
  const file = h("input", { type: "file", accept: ".zip", style: "display:none", onchange: async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    const name = prompt("Name for this icon pack:", f.name.replace(/\.zip$/i, "")); if (name === null) return;
    const keep = confirm("Keep the icons' own colours?\n\nOK = keep their colours\nCancel = draw them in the theme's colours (best for one-colour icons)");
    try {
      let r;
      try { r = await api("/api/iconpack_import", { data: await readAsDataURL(f), name, tint: !keep }); }
      catch (err) {
        if (!/already have/.test(err.message) || !confirm(err.message + "\n\nReplace it?")) throw err;
        r = await api("/api/iconpack_import", { data: await readAsDataURL(f), name, tint: !keep, replace: true });
      }
      if (r.pending.length) await ipDrawSvgs(r.id, r.pending);
      S.iconpacks = (await api("/api/iconpacks")).packs; IP.index.delete(r.id);
      packId = r.id; fillSel(); fill(); toast(`Icon pack added (${r.count + r.pending.length} icons)`);
    } catch (err) { toast(err.message, true); }
  } });
  const back = h("div", { class: "ipick-back", onclick: e => { if (e.target === back) close(); } },
    h("div", { class: "ipick", role: "dialog", "aria-label": "Choose an icon" },
      h("div", { class: "ipick-head" },
        h("div", { class: "top" }, h("h2", {}, "Choose an icon"),
          h("button", { class: "btn small", onclick: () => { onPick(""); close(); } }, "No icon"),
          h("button", { class: "btn small", onclick: close }, "Close")),
        h("div", { class: "row" }, h("div", {}, search), h("div", { class: "fit" }, sel)), followBox),
      grid,
      h("div", { class: "ipick-foot" }, info, file, del, exp, h("button", { class: "btn small", onclick: () => file.click() }, "Import a pack (.zip of PNG/SVG)"))));
  document.addEventListener("keydown", onKey);
  document.body.append(back);
  fillSel(); fill(); search.focus();
}
/* SVGs are drawn here in the browser (the app has no SVG engine) and sent back as PNGs. */
async function ipDrawSvgs(id, names) {
  let done = 0;
  for (const name of names) {
    try {
      const img = new Image();
      img.src = "/api/iconpack_svg?" + q({ id, name });
      await img.decode();
      const c = document.createElement("canvas"); c.width = c.height = 96;
      const w = img.naturalWidth || 96, hgt = img.naturalHeight || 96, s = 96 / Math.max(w, hgt);
      c.getContext("2d").drawImage(img, (96 - w * s) / 2, (96 - hgt * s) / 2, w * s, hgt * s);
      await api("/api/iconpack_drawn", { id, name, data: c.toDataURL("image/png") });
    } catch (e) { console.warn("could not draw", name, e); }
    if (++done % 10 === 0) toast(`Drawing SVG icons… ${done} of ${names.length}`);
  }
}
</script>
<script>
"use strict";
const TOKEN = "__VSDPAD_TOKEN__";
const GLYPHS = "♪ ♫ ▶ ⏸ ⏹ ⏭ ⏮ ✕ ✓ ⚙ ⌂ ☎ ✦ ★ ♥ ☀ ☾ ⚡ ⏻ ☁ ✉ ⌨ ⌕ ☰ ↻ ➜ ⚑ ⬆ ⬇ ◐ ◉ ⏏ ← ↩ ⏱ ☕ 🎮 🎧 🎤 💡 📁 📂 🔒 🖥".split(" ");
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = !!v;
    else if (k === "disabled") e.disabled = !!v;
    else if (k === "selected") e.selected = !!v;
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(3)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
async function api(path, body, raw = false) {
  const opt = { headers: { "X-VSDPad-Token": TOKEN } };
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);

      h("h3", {}, "Also include themes"), pick(ch.themes, themeBoxes),
      h("h3", {}, "Your icon packs"), pick(ch.iconpacks, iconBoxes),
      h("label", { class: "f" }, h("span", {}, "Name"), name),
      h("div", { class: "actions" },
        h("button", { class: "btn primary", onclick: () => {
          const chosen = boxes => [...boxes].filter(([, b]) => b.checked && !b.disabled).map(([id]) => id).join(",");
          if (!prof.value && !chosen(themeBoxes) && !chosen(iconBoxes)) return toast("Pick pages, a theme or an icon pack to share", true);
          if (dirty) toast("Unsaved changes aren't in the pack: save first to include them", true);
          location.href = "/api/pack_export?" + q({ profile: prof.value, themes: chosen(themeBoxes), icons: chosen(iconBoxes), name: name.value.trim() });
        } }, "Download pack"),
        file, h("button", { class: "btn", onclick: () => file.click() }, "Import a pack")),
      h("p", { class: "hint" }, "Import also takes a layout file from “Download my layout” and adds it as a profile."));
    sync();
  }).catch(e => body.replaceChildren(h("p", { class: "err-text" }, e.message)));
  return panel;
}

/* ---------------- saving, undo, polling ---------------- */
async function saveAll() {
  try {
    const cfg = clone(C()); delete cfg.plugins;
    await api("/api/config", { config: cfg });
    dirty = false; $("#save").disabled = true; toast("Saved — the pad is updated");
    const fresh = await api("/api/state"); S = fresh; return true;
  } catch (e) { toast(e.message, true); return false; }
}
$("#save").onclick = async () => { if (await saveAll()) render(); };
$("#undo").onclick = async () => {
  if (dirty && !confirm("Throw away your unsaved changes and undo the last save?")) return;
  try { await api("/api/undo", {}); dirty = false; $("#save").disabled = true; previewCache.clear(); toast("Undone"); await load(); }
  catch (e) { toast(e.message, true); }
};
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (dirty) $("#save").click(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
const seqs = {};
let profileNoted = null;
setInterval(async () => {
  if (!S || document.hidden) return;
  try {
    const st = await api("/api/status"); S.status = st; renderPills();
    if (st.profile && st.profile.id !== activeProfile() && profileList().length > 1) {   // switched from the pad, phone or schedule
      if (!dirty) { previewCache.clear(); L = 0; P = 0; sel = 1; await load(); toast("The pad switched to the profile " + st.profile.name); }
      else if (profileNoted !== st.profile.id) { profileNoted = st.profile.id; toast("The pad switched to " + st.profile.name + ". Saving your edits switches it back; Undo save drops them.", true); }
    }
    for (const d of st.devices) {
      const old = seqs[d.id]; seqs[d.id] = d.press_seq;
      if (old === undefined || old === d.press_seq || d.last_press == null) continue;
      if (learning && Date.now() < learning.until && d.layout === learning.layout && d.last_press > d.cols * d.rows) {
        const l = learning; learning = null; assignButton(d.id, l.pos, d.last_press); continue;
      }
      if (tab === "keys" && d.layout === lay().id) flash(d.last_press);
    }
    if (learning && Date.now() > learning.until) { learning = null; toast("No button pressed", true); render(); }
    if (tab === "keys") document.querySelectorAll(".tabchip[data-page]").forEach(t => {
      const on = shownOn(t.dataset.page), dot = t.querySelector(".dot");
      if (on && !dot) t.append(h("span", { class: "dot" }, "●")); if (!on && dot) dot.remove(); });
  } catch (e) { $("#devpills").replaceChildren(h("span", { class: "pill off" }, "The app isn't running — start it and reload")); }
}, 700);
load().catch(e => $("#main").append(h("p", { class: "err-text" }, "Could not load: " + e.message)));
</script>
</body>
