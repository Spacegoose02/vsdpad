<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VSD Pad">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>VSD Pad remote</title>
<style>
  :root { --bg: #101116; --panel: #1a1c23; --panel2: #23262f; --line: #2f3340; --text: #eceef4; --muted: #8f95a8;
          --accent: #ffaa28; --accent-ink: #1a1203; --bad: #ff7a7a; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, "Segoe UI", sans-serif;
               overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 auto 0 0; white-space: nowrap; } header h1 span { color: var(--accent); }
  select, input, button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  select { max-width: 46vw; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
  .pages { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 8px; scrollbar-width: none; }
  .pages::-webkit-scrollbar { display: none; }
  .pages button { white-space: nowrap; font-size: 14px; padding: 6px 12px; background: var(--panel); color: var(--muted); }
  .pages button.on { color: var(--text); border-color: var(--accent); }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 12px 12px; min-height: 0; }
  .grid { display: grid; gap: 8px; width: 100%; }
  .key { aspect-ratio: 1; border-radius: 14%; background: #000; overflow: hidden; border: 0; padding: 0; touch-action: none;
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: transform .06s, filter .06s; }
  .key img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .key.down { transform: scale(.93); filter: brightness(1.35); }
  .btns { display: flex; gap: 14px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .rbtn { width: 64px; height: 64px; border-radius: 50%; font-size: 12px; touch-action: none; user-select: none; -webkit-user-select: none;
          overflow: hidden; text-overflow: ellipsis; padding: 4px; }
  .rbtn.down { border-color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; text-align: center; margin: 8px 0 0; min-height: 18px; }
  .pair { max-width: 360px; width: 100%; margin: auto; padding: 24px 16px; text-align: center; }
  .pair h2 { margin: 0 0 6px; } .pair p { color: var(--muted); margin: 0 0 18px; }
  .pair input { width: 100%; margin-bottom: 12px; text-align: center; }
  .pair input.code { font-size: 30px; letter-spacing: 10px; font-variant-numeric: tabular-nums; }
  .pair button { width: 100%; padding: 12px; }
  .err { color: var(--bad); min-height: 22px; margin-top: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 16px; }
</style>
</head>
<body>
<header>
  <h1>VSD <span>Pad</span></h1>
  <select id="pad" aria-label="Pad" hidden></select>
  <select id="profile" aria-label="Profile" hidden></select>
</header>
<div class="pages" id="pages"></div>
<main id="main"></main>
<script>
"use strict";
const $ = s => document.querySelector(s);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
let TOKEN = store.get("vsdpad-remote-token"), PAD = store.get("vsdpad-remote-pad") || "";
let state = null, shownKeys = [], grid = null, polling = null, failures = 0;
const imgs = new Map();   // slot -> {v, url}

async function call(path, body) {
  const opt = { headers: { "X-Remote-Token": TOKEN || "" } };
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) { unpaired("This phone isn't paired (or was removed in Settings). Pair it again."); throw new Error("unpaired"); }
  return r;
}
async function callJSON(path, body) {
  const r = await call(path, body);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* ---------- pairing ---------- */
function deviceName() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "iPad";
  if (/iPhone/.test(ua)) return "iPhone";
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? "Android phone" : "Android tablet";
  return "Browser";
}
function unpaired(msg) {
  TOKEN = null; store.set("vsdpad-remote-token", null);
  clearInterval(polling); polling = null;
  $("#pad").hidden = $("#profile").hidden = true; $("#pages").replaceChildren();
  const fromLink = (location.hash.match(/pair=(\d{6})/) || [])[1] || "";
  const code = h("input", { class: "code", inputmode: "numeric", autocomplete: "one-time-code", maxlength: 6, placeholder: "······", value: fromLink, "aria-label": "Pairing code" });
  const name = h("input", { value: deviceName(), maxlength: 40, "aria-label": "Name for this device" });
  const err = h("div", { class: "err" }, msg || "");
  const go = h("button", { class: "primary" }, "Pair");
  go.onclick = async () => {
    go.disabled = true; err.textContent = "";
    try {
      const r = await fetch("/r/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code.value, name: name.value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "Pairing didn't work.");
      TOKEN = j.token; store.set("vsdpad-remote-token", TOKEN);
      history.replaceState(null, "", location.pathname);
      start();
    } catch (e) { err.textContent = e.message; go.disabled = false; }
  };
  code.addEventListener("keydown", e => { if (e.key === "Enter") go.click(); });
  $("#main").replaceChildren(h("div", { class: "pair" },
    h("h2", {}, "Pair this " + (/iPad|tablet/.test(deviceName()) ? "tablet" : "phone")),
    h("p", {}, "On the PC, open VSD Pad settings, go to Settings, Phone remote, and click Pair a phone. Type the 6-digit code here."),
    code, name, go, err));
  if (fromLink) go.click(); else code.focus();
}

/* ---------- the pad ---------- */
function press(el, key) {
  let down = false;
  const send = d => {
    if (d === down) return; down = d; el.classList.toggle("down", d);
    if (d && navigator.vibrate) navigator.vibrate(12);
    call("/r/press", { pad: state.pad.id, key, down: d }).catch(() => {});
  };
  el.addEventListener("pointerdown", e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) {} send(true); });
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) el.addEventListener(ev, () => send(false));
  el.addEventListener("contextmenu", e => e.preventDefault());
  el._release = () => send(false);
}
function fit() {
  if (!grid || !state || !state.pad) return;
  const { cols, rows } = state.pad, m = $("#main");
  const extra = state.pad.buttons.length ? 92 : 30;
  const byH = (m.clientHeight - extra - (rows - 1) * 8) / rows * cols + (cols - 1) * 8;
  grid.style.maxWidth = Math.max(160, Math.min(m.clientWidth, byH, 900)) + "px";
}
function build() {
  const p = state.pad;
  imgs.clear();
  grid = h("div", { class: "grid", style: `grid-template-columns:repeat(${p.cols},1fr)` });
  for (let n = 1; n <= p.cols * p.rows; n++) { const b = h("button", { class: "key", "data-slot": n, "aria-label": "Key " + n }); press(b, n); grid.append(b); }
  const btns = p.buttons.length ? h("div", { class: "btns" }, p.buttons.map(b => { const e = h("button", { class: "rbtn" }, b.icon ? b.icon + " " : "", b.label || "●"); press(e, b.id); return e; })) : null;
  $("#main").replaceChildren(grid, btns, h("div", { class: "sub", id: "sub" }));
  shownKeys = [];
  fit();
}
async function loadKey(slot, v) {
  const el = grid && grid.querySelector(`.key[data-slot="${slot}"]`);
  if (!el) return;
  const have = imgs.get(slot);
  if (have && have.v === v) return;
  imgs.set(slot, { v, url: have && have.url });
  if (!v) { el.replaceChildren(); return; }
  const r = await call(`/r/key?pad=${encodeURIComponent(state.pad.id)}&slot=${slot}&v=${v}`);
  if (!r.ok) return;
  const url = URL.createObjectURL(await r.blob());
  const cur = imgs.get(slot);
  if (!cur || cur.v !== v) { URL.revokeObjectURL(url); return; }
  if (cur.url) URL.revokeObjectURL(cur.url);
  cur.url = url;
  el.replaceChildren(h("img", { src: url, alt: "" }));
}
function header() {
  const pad = $("#pad"), prof = $("#profile");
  pad.hidden = state.pads.length < 2;
  pad.replaceChildren(...state.pads.map(p => h("option", { value: p.id, selected: state.pad && p.id === state.pad.id ? "" : null }, p.name)));
  pad.value = state.pad ? state.pad.id : "";
  prof.hidden = state.profiles.length < 2;
  prof.replaceChildren(...state.profiles.map(p => h("option", { value: p.id }, p.name)));
  prof.value = (state.profiles.find(p => p.active) || {}).id || "";
  const pages = $("#pages");
  pages.replaceChildren();
  if (state.pad && state.pad.pages.length > 1)
    for (const pg of state.pad.pages) pages.append(h("button", { class: pg.id === state.pad.page ? "on" : "",
      onclick: () => callJSON("/r/page", { pad: state.pad.id, page: pg.id }).then(poll).catch(() => {}) }, pg.name));
}
$("#pad").onchange = e => { PAD = e.target.value; store.set("vsdpad-remote-pad", PAD); grid = null; poll(); };
$("#profile").onchange = e => callJSON("/r/profile", { profile: e.target.value }).then(poll).catch(err => alert(err.message));

let busy = false, lastHead = "";
async function poll() {
  if (busy || !TOKEN) return;
  busy = true;
  try {
    const s = await callJSON("/r/state?pad=" + encodeURIComponent(PAD));
    failures = 0;
    const shape = s.pad ? [s.pad.id, s.pad.cols, s.pad.rows, JSON.stringify(s.pad.buttons)].join("|") : "";
    const oldShape = state && state.pad ? [state.pad.id, state.pad.cols, state.pad.rows, JSON.stringify(state.pad.buttons)].join("|") : "";
    state = s;
    if (!s.pad) { grid = null; $("#main").replaceChildren(h("p", { class: "empty" }, "No pages yet.")); header(); return; }
    if (!grid || shape !== oldShape) build();
    const head = JSON.stringify([s.pads, s.profiles, s.pad.pages, s.pad.page]);
    if (head !== lastHead) { lastHead = head; header(); }
    const sub = $("#sub"); if (sub) sub.textContent = s.pad.folder ? "📁 " + s.pad.page_name : (s.pad.pages.length > 1 ? "" : s.pad.page_name);
    s.pad.keys.forEach((v, i) => loadKey(i + 1, v).catch(() => {}));
  } catch (e) {
    if (e.message !== "unpaired" && ++failures >= 3) { const sub = $("#sub"); if (sub) sub.textContent = "Can't reach the PC. Is VSD Pad running?"; }
  } finally { busy = false; }
}
function start() {
  $("#main").replaceChildren(h("p", { class: "empty" }, "Connecting…"));
  state = null; grid = null; lastHead = "";
  poll();
  clearInterval(polling);
  polling = setInterval(() => { if (!document.hidden) poll(); }, 1000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) document.querySelectorAll(".key,.rbtn").forEach(k => k._release && k._release());
  else poll();
});
window.addEventListener("resize", fit);
if (TOKEN) start(); else unpaired();
</script>
</body>
</html>
